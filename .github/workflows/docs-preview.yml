name: Docs Preview

on:
  pull_request:
    branches:
      - develop
      # Add more year branches as you create them:
      # - feature/2026
      # - '2026'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libuv1-dev \
            libsecret-1-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y r-base-dev build-essential
      - name: Install system dependencies2
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libudunits2-dev libgdal-dev libgeos-dev libproj-dev cmake libfreetype6-dev libfontconfig1-dev xclip
      - name: install textshaping package
        run: sudo apt install libharfbuzz-dev libfribidi-dev
      - name: Install R dependencies from CRAN
        run: Rscript -e 'install.packages(c("downlit", "cli", "R6", "fansi", "memoise", "rlang", "vctrs", "withr", "yaml", "renv", "Kendall"), repos = "https://cloud.r-project.org")'
      - name: Install rmarkdown
        run: Rscript -e 'install.packages("rmarkdown", repos = "https://cloud.r-project.org")'
      - name: Render Book
        run: Rscript -e 'renv::restore(); bookdown::render_book("index.Rmd")'
        working-directory: ./
      - name: Add .nojekyll file
        run: touch ./_book/.nojekyll
      - name: Deploy preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          destination_dir: preview/pr-${{ github.event.pull_request.number }}
          keep_files: true
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/preview/pr-${context.payload.pull_request.number}/`;
            const comment = `## 📚 Preview Deployed!\n\n🔗 **[View Preview](${url})**\n\nThis preview will be available until the PR is closed.`;
            
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existing = comments.data.find(c => 
              c.user.type === 'Bot' && c.body.includes('Preview Deployed')
            );
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
